[pytest]
markers =
    hardware: Tests that require actual hardware (ESP32, camera)
    slow: Tests that take significant time to complete

# Default options
addopts = --ignore=tests/test_autofocus.py --ignore=tests/test_jpeg_encoding.py --ignore=tests/test_pi_diagnostics.py
testpaths = tests

# Timeout for tests (seconds)
timeout = 60
